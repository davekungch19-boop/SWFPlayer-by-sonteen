name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Ruffle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/r
          gh release download --repo ruffle-rs/ruffle --pattern '*web-selfhosted.zip' --dir /tmp/r
          cd /tmp/r && unzip -oq *.zip
          D=$(dirname "$(find /tmp/r -name ruffle.js | head -1)")
          mkdir -p $GITHUB_WORKSPACE/app/src/main/assets/ruffle
          cp -r "$D"/. $GITHUB_WORKSPACE/app/src/main/assets/ruffle/
          ls $GITHUB_WORKSPACE/app/src/main/assets/ruffle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SWFPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

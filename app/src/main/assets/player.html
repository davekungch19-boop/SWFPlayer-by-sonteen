<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden} ruffle-player{width:100%;height:100%}
</style><script src="ruffle/ruffle.js"></script></head><body><div id="player"></div><script>
const p=new URLSearchParams(location.search).get('swf');
if(p){const R=window.RufflePlayer&&window.RufflePlayer.newest(); if(R){const x=R.createPlayer();x.style.width='100%';x.style.height='100%';document.getElementById('player').appendChild(x);x.ruffle().load(p).catch(e=>document.body.innerHTML='<pre style="color:white">'+e+'</pre>');}}
</script></body></html>
